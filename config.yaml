# ==================================================================
# 集中配置文件
# ------------------------------------------------------------------
# 标有 [热更新] 的参数：改完保存即可，约 2 秒自动生效，无需重启服务。
# 未标注的参数：需要重启服务才生效（它们决定线程池、模型、端口等
# 对象如何创建，热改只会造成"看着改了、其实没生效"的错觉）。
#
# 改完可在日志里搜索 "[配置热更新]" 确认是否已应用。
# 各段自身的说明就写在该段上方的注释里（原来这里指向的
# docs/配置生效说明.md 并不存在，已改为就地说明）。
# ==================================================================

# ------------------------------------------------------------------
# 配置热更新
# ------------------------------------------------------------------
config_reload:
  enabled: true              # 关掉则所有参数都回到"必须重启"的行为
  check_interval: 2.0        # 检查文件变更的最小间隔（秒）
  log_changes: true          # 变更时把 "旧值 -> 新值" 打进日志
  # 后台监听线程：主动轮询配置文件。
  # 关掉它会退化为"拉取式" —— 只有代码读到某个配置项时才检查，
  # 于是没有疵点检出时改了配置既不生效、日志也没有任何提示。
  watch_in_background: true

# ------------------------------------------------------------------
# 路径配置
# ------------------------------------------------------------------
paths:
  detection_base_path: "D:\\yolo_detection_results"
  detection_save_path: "D:\\yolo_detection_results"
  machine_stop_path: "D:\\yolo_detection_results"

# ------------------------------------------------------------------
# 上传配置
# ------------------------------------------------------------------
upload:
  api_host: "localhost"
  api_port: 8890
  api_base_path: "/api"   # 后端 API 前缀；全系统上报地址均由此三项拼出
  normal_upload_workers: 3
  normal_upload_queue_size: 256
  normal_upload_timeout: 10
  stop_upload_timeout: 3
  max_retry: 5
  retry_interval: 1.0

# ------------------------------------------------------------------
# PLC / 编码器触发（Modbus）
# ------------------------------------------------------------------
plc:
  host: "192.168.123.70"
  port: 502
  wheel_diameter: 60.0          # 胶轮直径 mm
  encoder_ppr: 2000             # 编码器分辨率 P/R
  scaling_factor: 0.78651
  trigger_distance_mm: 102      # 触发间距（会再乘以 scaling_factor）
  read_interval_ms: 100
  speed_threshold_ratio: 0.0
  # 织机停机预览：速度低于阈值并持续确认时长后，转为软触发低频出图供前端查看
  idle_speed_threshold: 0.5     # m/min
  idle_confirm_duration: 3.0    # s
  preview_interval: 1.0         # s，预览期间软触发间隔
  fabric_upload_interval: 5.0   # s，布料尺寸上报(/v1/defect/log/size)节流间隔

# ------------------------------------------------------------------
# WebSocket 预览服务
# ------------------------------------------------------------------
websocket:
  host: "0.0.0.0"
  port: 8765
  # 预览画质：只给人眼看，不必用采集分辨率与帧率。
  # 编码在独立线程完成，绝不占用相机回调线程；调高会增加 CPU 占用。
  preview_max_fps: 4.0      # 每台相机的预览推送上限
  preview_max_width: 960    # 超过则等比缩放后再编码（2440->960 约省 85% 编码耗时）
  jpeg_quality: 70

# ------------------------------------------------------------------
# 日志
# ------------------------------------------------------------------
logging:
  file: "logs/app.log"
  # 生产环境用 INFO。DEBUG 会在相机采集线程上产生每秒上百条日志，
  # 叠加同步落盘的 RotatingFileHandler，足以把采集线程拖到丢帧。
  # 需要排查具体某条链路时再临时改成 DEBUG，查完改回来。
  level: "INFO"
  max_bytes: 5242880            # 5MB
  backup_count: 3
  # 健康心跳：每 N 秒往日志写一行快照（RSS/线程数/GC/队列深度/相机丢帧）。
  # 整机卡死重启后，翻最后几行心跳就能看出是"内存一路涨"还是"突然断掉"。
  # <=0 表示关闭。
  health_interval: 30
  # 进程 RSS 超过此值(MB)时心跳升级为 WARNING；0=不告警。
  # 按现场物理内存的一半左右设置，留出 YOLO/TensorRT 的余量。
  health_rss_warn_mb: 12288
  # 线程数超过此值时升级为 WARNING；0=不告警。正常稳定在几十，
  # 持续爬升说明有线程泄漏。
  health_thread_warn: 200
  # 内核**非分页池**相比启动基线增长超过此值(MB)时升级为 WARNING；0=不告警。
  #
  # 为什么单列一项：网卡驱动和 GigE 过滤驱动是从内核非分页池分配内存的，
  # 那是独立于物理内存的另一套资源。收包路径一堵，驱动持续申请，池子见底时
  # 整个 Windows 失稳、只能硬重启 —— 而此时物理内存可能才用 60%，
  # rss_warn_mb 和 MemoryGuard 两道基于物理内存的防线都不会触发。
  #
  # 健康的 Win10/11 上这个值一般稳定在几百 MB 且不随运行时间增长。
  # 若日志里看到它一路爬升（例如 300MB -> 2GB），用 poolmon 定位驱动标签。
  # 仅 Windows 有效；其他平台取不到数据，心跳里不会出现这些字段。
  health_pool_growth_warn_mb: 512
  # 卡死诊断：N 秒转储一次各线程栈到 logs/crash.log；<=0 表示关闭。
  # 转储线程跑在 C 层、不需要 GIL，所以即使所有 Python 线程都死锁在 GIL 上
  # 也照样能把栈打出来。现场卡死时，crash.log 里最后一次转储就是各线程
  # 当时的位置 —— 这是排查"整机突然卡死"最直接的证据，务必保持开启。
  faulthandler_dump_after: 60
  # 启动时检查网卡上是否同时挂了多个 GigE Vision 过滤驱动。
  #
  # 为什么单列一项：本项目已从海康 MVS 换成大恒 Galaxy，代码里的海康调用
  # 清零了，但**驱动装在操作系统上、不随代码走**。两个 GigE 过滤驱动挂
  # 同一张网卡是"整机网络栈卡死 / 电脑死机"的高频原因，而且从 Python 侧
  # 完全看不出异常 —— 进程还活着，整台机器不动了。
  #
  # 启动日志会打印每张网卡已绑定的过滤驱动完整清单；**发现同一张网卡上挂了
  # ≥2 个疑似 GigE 过滤驱动时直接拒绝启动**（不开相机，退出码 1），并打印
  # 是哪张网卡、哪几个驱动、以及修复命令。
  #
  # 这个开关现在是**硬闸门的唯一关闭方式**：
  #   程序不认任何运行时绕过（环境变量 / 命令行参数都不认）。
  #   关掉之后连过滤驱动清单日志都不再打印。
  # 判定门槛：只在"确实查到了、且确认有冲突"时才拦；读不到注册表（权限
  # 不足、非 Windows 开发机）时放行，只留一条"没查成"的日志。
  #
  # 已知的误判面：特征表里除海康/大恒外还有 Basler/Pleora/Matrox/Stemmer，
  # 现场若装过这些厂商的无害驱动会被一并算作冲突而无法启动。真遇到时，把
  # 这个开关设为 false 是唯一出路（这是当初选"严格拦截、不留绕过"时接受的
  # 代价）。
  nic_filter_check: true
  # 补充的 GigE 过滤驱动名字特征（大小写不敏感子串），**追加**在内置表之上。
  # 内置表已覆盖 海康(hikvision/hikrobot/mvs/mvgige)、大恒(daheng/galaxy/
  # gxgige/gxiapi)、Basler/Pleora/Matrox 等，以及通用的 gige/gvsp。
  # 只有当日志显示"未识别到任何疑似 GigE 过滤驱动"但现场确实在用 GigE 相机时，
  # 才需要把日志清单里的驱动名补进来。留空即可。
  nic_filter_patterns: []

# ------------------------------------------------------------------
# 尺寸转换常量
# ------------------------------------------------------------------
size_conversion:
  real_width_cm: 23
  image_width_px: 2440

# ------------------------------------------------------------------
# 分析模式
# ------------------------------------------------------------------
analysis:
  stop_analysis_mode: "coarse"
  valid_modes: ["coarse", "dinomaly", "none"]

# ------------------------------------------------------------------
# 粗粒度缺陷分析配置
# ------------------------------------------------------------------
coarse_detect:
  blur_kernel_size: 9
  blur_sigma: 2.5
  bright_percentile: 85
  dark_percentile: 15
  morph_kernel_size: 11
  close_iterations: 2
  open_iterations: 1
  min_area_pixels: 20

class_detect:
  经线毛球:
    detect_dark: true
    percentile: 15
    min_area: 20
  纬线杂质:
    detect_dark: true
    percentile: 15
    min_area: 20
  飘絮:
    detect_dark: false
    percentile: 90
    min_area: 0.5
  棉团:
    detect_dark: false
    percentile: 90
    min_area: 0.5

default_detect:
  detect_dark: false
  percentile: 85
  min_area: 20

# ==================================================================
# 阈值配置总览
# ------------------------------------------------------------------
# 两套阈值，各自都有「全局」和「按相机」两份，分别放在相邻位置：
#
#   【一】检测阈值 —— 决定一个框算不算缺陷（在 _filter_boxes 里生效）
#         class_confidence_thresholds     全局按类
#         default_class_confidence        全局默认（没列出的类用它兜底）
#         camera_threshold_overrides      按相机覆盖（8 台已展开）
#
#   【二】停机阈值 —— 决定一个缺陷要不要停机（在 StopMachineService 里生效）
#         machine_stop_rules              全局按类
#         camera_stop_rule_overrides      按相机覆盖（8 台已展开）
#
# 两者的关系（重要）：停机判定吃的是**过滤后**的框，所以
#         有效停机门槛 = max(该相机检测阈值, 该相机停机 min_confidence)
# 只改一边也可能改变停机行为。启动日志会对两段分别做交叉校验并打印结果，
# 看到 才说明停机没受影响。
#
# 两段「按相机」都已把 8 台逐类列全，所以改**全局**那两份对这 8 台
#    不再生效。要改就改对应相机那一段，或者 8 段一起改。
# ==================================================================

# ------------------------------------------------------------------
# 【一】检测阈值 · 全局  [热更新]
# ------------------------------------------------------------------
class_confidence_thresholds:
  多股线:     0.65
  纬线杂质:   0.5
  油点线:     0.85
  包边不重叠: 0.7
  飘絮:       0.5
  单根包不进: 0.87
  蚊虫小黑点: 0.95
  包边不良:   0.5
  纬线不直:   0.35
  短废纱线:   0.5
  经线毛球:   0.5
  # ---- 以下 8 类为补全 19 项疵点清单新增 ----
  # 值 = 补全前的实际生效值（回落到 default_class_confidence=0.1），
  # 即**行为与补全前完全一致**；这些数偏低，请按现场实测逐个调。
  断纬   : 0.1
  捻接器接头: 0.1
  小尾巴  : 0.1
  手工接头 : 0.1
  纬斜   : 0.1
  棉团   : 0.1
  小布头  : 0.1
  稀缝   : 0.1

default_class_confidence: 0.1

# ------------------------------------------------------------------
# 【一】检测阈值 · 按相机覆盖  [热更新]
# ------------------------------------------------------------------
# 下面 8 台相机已全部展开，每台的初始值 = 上面 class_confidence_thresholds
# 的当前值，也就是**行为与不配置时完全一致**。要调哪台就改哪台的数。
#
# 展开之后有两个后果，务必知道：
#
#   1. **改上面全局的 class_confidence_thresholds 对这 8 台不再生效。**
#      每台都已逐类列全，全局值被遮蔽。要改就改对应相机那一段，
#      或者 8 段一起改。
#   2. 这里**故意不写 default_class_confidence**。写了会让该相机上所有
#      "没在下面列出的类" 都用这个默认值，把全局的按类阈值全部遮蔽掉。
#      目前有 4 个类只存在于 machine_stop_rules（棉团、捻接器接头、
#      小尾巴、稀缝），它们没有检测阈值、走全局 default_class_confidence
#      = 0.1；不写 default 才能让它们继续正确回落。
#
# 与停机阈值的关系（重要）：
#   这里只管**检测**。停机用的是下面的 machine_stop_rules → rules → <类> →
#   min_confidence，那是按类别的全局值，**与相机无关**，本段不会改动它。
#   但停机判定吃的是过滤后的框，所以：
#       有效停机门槛 = max(该相机检测阈值, 该类停机 min_confidence)
#   检测阈值低于停机阈值时由停机阈值把关（怎么降都不影响停机）；
#   检测阈值高于停机阈值时由检测阈值把关（降它会让停机变频繁）。
#   启动日志会做交叉校验并列出所有"改变了停机行为"的项，
#   看到 "交叉校验：均未改变停机行为" 才说明停机没受影响。
#
