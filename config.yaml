# ==================================================================
# 【三】停机 · 重复触发（同一台相机上同类疵点在时间窗口内反复出现）  [热更新]
# ==================================================================
# 需求：「在一台相机上，连续几秒检测到相同类型的疵点，就停机」
#
# 与【二】的单次停机规则**并存**：两条任一条满足就停机。
#   · 单次规则问："这一个疵点够不够严重？"（面积/长宽/置信度）
#   · 重复规则问："这类疵点是不是一直在出现？"
#
# 计数门槛 min_confidence 与单次停机门槛是**两回事**，别混：
#   「包边不良」的单次规则要求 conf>=0.9 且 >=10x10mm。如果重复规则也用 0.9，
#   那第 1 次就已经单次停机了，永远攒不到第 3 次 —— 本功能等于没开。
#   所以这里用 0.5（= 检测阈值），专门抓"反复出现但每次都不够严重"的。
#
# 三条已确认的语义：
#   1. **按帧计数**：同一帧里同类出现 5 个框也只算 1 次
#      （按框算的话单帧误检 3 个就会立刻误停）
#   2. **滑动窗口**：任意 window_sec 秒内累计满 count 次即触发，中间允许空档
#   3. 触发后窗口**清空**重新计，否则之后每一帧都会重复触发
#
# 判定用**单调时钟**（time.monotonic），不受系统对时/NTP 校时影响。
# 现场节拍：10 m/min 下每台约 2.08 帧/秒，3 秒 ≈ 6 帧，
# "3 秒内 3 次" ≈ 6 帧里有 3 帧检出，约 0.96 秒就会触发。
#
repeat_stop_rules:
  # 总开关。关掉后任何按相机配置都不生效（最高优先）。
  enabled: true

  # 参与名单：**只有列在这里的相机**才参与【三】重复触发。
  #    其余相机**连计数都不做** —— 攒够了也不能停，计数本身没有意义，
  #    白占滑动窗口、白刷日志。所以判定在计数之前就短路了。
  #    规则：
  #      · 不写这个键      = 所有相机都参与（向后兼容）
  #      · 写成 []         = 谁都不参与（本功能整体不生效）
  #      · 写成 [a, b]     = 只有 a、b 参与
  #    这个名单**只管【三】**，【二】单次停机在 8 台上的行为没动。
  stop_allowed_cameras:
    - camera1
    - camera8

  # 规则本体。写在这里是全局默认，但**实际只对 stop_allowed_cameras 里的
  # 相机生效**（当前是 camera1 / camera8）。
  #
  # 要给某一台单独调参（比如让 camera1 更敏感），**新增一个顶层键**
  # camera_repeat_stop_overrides 即可，不写就是所有参与相机都用上面这套：
  #
  #   camera_repeat_stop_overrides:
  #     camera1:
  #       rules:
  #         包边不良:
  #           count: 2          # 只改这一个数，其余沿用全局
  #
  # 逐键覆盖，没写的键回落全局值；改一台不影响另一台。
  # 也可以对某台关掉某个类：把该类的 enabled 写成 false。
  #
  # 只有**在 stop_allowed_cameras 白名单里的相机**，覆盖才有意义。
  #    白名单外的相机在计数之前就被短路了，给它配覆盖是**死配置** ——
  #    实测配了 count=2 也照样 occurrences=0、不停机。
  #    （由 test_override_for_unlisted_camera_is_dead_config 钉住）
  rules:
    包边不良:
      enabled       : true
      count         : 3        # 窗口内累计多少次
      window_sec    : 3.0      # 滑动窗口长度（秒）
      min_confidence: 0.5      # 计数门槛（独立于单次停机的 0.9）

    # ---- 单根包不进 ----
    # 这个类**故意不写 min_confidence**，原因是它的门槛结构和包边不良不同：
    #    · 检测阈值（class_confidence_thresholds）= **0.87**
    #    · 单次停机门槛 min_confidence = 0.5
    #    能走到停机判定的框，置信度早就 >= 0.87 了，所以 0.5 那条**永远不是
    #    瓶颈**（有效门槛 = max(检测阈值, 停机门槛) = 0.87）。
    #    再写一个 <= 0.87 的计数门槛等于没写；写死了反而会在将来调低检测阈值时
    #    悄悄变成新的瓶颈。**不写 = 跟随检测阈值**，最稳。
    #
    #    这个类真正被放松的是**高度**：单次规则要求 min_height_mm=47
    #    （= 498.6 px，帧高 193 mm 的 24%）。重复规则**不看高度**，
    #    所以它抓的正是"反复出现、但每次都不够 47 mm"的那些 ——
    #    这类以前完全不会停机。这是**灵敏度提升**，现场跑一段后
    #    若发现误停多，就给它加 count 或加窗口。
    单根包不进:
      enabled    : true
      count      : 3
      window_sec : 3.0
      # min_confidence 故意不写，见上面说明



# ==================================================================
# 【四】正常图片定时保存（前端下发窗口后才生效）
# ==================================================================
# 用途：在指定的时间段内，定时把**没检出任何缺陷**的帧存下来，
#       用于事后核对"这段时间机台确实是正常的"。
#
# 触发方式：**不是**开机就存。必须前端下发「开始时刻 + 持续时长」才开始：
#   Thrift  setNormalSaveWindow(start, duration_sec)   开窗口
#           stopNormalSave()                           提前结束
#           getNormalSaveStatus()                      查进度
# 没下发窗口时，这里的配置只是待命参数，一张都不会存。
#
# 每台相机每个窗口最多 max_per_camera 张（需求写死 10）。
#
# **存 PNG（无损）**，体积要心里有数。实测 2440x2048 的真实纹理图：
#     PNG c1  13.02 MB / 488 ms      JPEG q90  2.96 MB / 32 ms
# 8 台 × 10 张 = 80 张，一个窗口约 **1.0 GB**。所以 10 张这个上限不是
# 随手定的，是拿磁盘换无损。**一天开几十次窗口就是几十 GB，现场要有人清盘。**
# 编码走独立线程（约 0.5 s/张），不占检测节拍。
#
# 落盘路径：<debug.save_path>/<launch_tag>/<相机>/NormalSave/
#           <时间戳>_<相机>_<序号>.png
# 落盘在独立线程，不占检测节拍。
#
normal_image_save:
  enabled: true            # 总开关。关掉后前端下发窗口也不生效
  interval_sec: 5.0        # 同一台相机两次保存的最小间隔（秒）
  max_per_camera: 10       # 每台相机每个窗口的硬上限
  # PNG 压缩级别 0-9。实测对布面这种高频纹理几乎没用：
  #   c1 = 13.02 MB / 488 ms，c9 = 12.99 MB / 509 ms（多花 20 ms 只省 0.03 MB）
  # 磁盘 I/O 是瓶颈时可降到 0：143 ms / 14.32 MB，快 3.4 倍，每张只大 1.3 MB。
  png_compression: 1
  save_subdir: NormalSave

# ==================================================================
# 【五】超速守卫
# ==================================================================
# 车速超过 warn_mpm 时，不再按编码器实际触发率收图，而是按 cap_speed_mpm
# 对应的触发率收图（每台相机两帧之间至少间隔 cap_interval）。
#
# 代入实配值：触发距离 = 102 x 0.78651 = 80.224 mm，cap_speed_mpm = 10
#   => 2.0775 帧/秒/台 => 最小帧间隔 481.3 ms
#
# 为什么需要：现场日志出现过 速度:41.9565m/min。按设计点 10 m/min 算每台
# 2.078 帧/秒；42 m/min 就是 8.7 帧/秒，8 台合计约 70 帧/秒 x 15 MB
# ≈ 1 GB/s 内存分配。而现有唯一的保护（worker_pool.submit 里的 memory_guard
# + 非阻塞信号量）触发在 _to_bgr **之后** —— 15 MB 已分配、Bayer 已转完才丢。
# 本守卫把闸门提到 _to_bgr 之前。
#
# 覆盖率代价，改这两个数之前必须看：
#
#   钳帧只能落在触发栅格上，所以实际接受间隔被**量化**成 k x 触发距离
#   （k = ceil(cap_interval / 触发间隔)，整数）。于是
#
#       接受帧间距 = k x 触发距离     ← 与车速无关，只取决于 k
#
#   帧高 = 2048 px x 0.0942623 = 193.05 mm。完整覆盖要求 k x 80.224 <= 193.05，
#   即 k <= floor(193.05 / 80.224) = 2。实测：
#
#       车速       k   接受间隔   间距       覆盖
#       10 m/min   1    481 ms    80.2 mm   完整（未钳帧）
#       15 m/min   2    642 ms   160.4 mm   完整
#       20 m/min   2    481 ms   160.4 mm   完整
#       24 m/min   3    602 ms   240.7 mm   盲区 47.6 mm
#       30 m/min   3    481 ms   240.7 mm   盲区 47.6 mm
#       42 m/min   5    573 ms   401.1 mm   盲区 208.1 mm
#
#   **临界车速 = floor(帧高/触发距离) x cap_speed_mpm = 2 x 10 = 20.0 m/min。**
#   （不是 帧高/cap_interval = 24.06 —— 那个忽略了量化，是错的。）
#   低于 20 m/min 一毫米都不漏；高于它必然出现盲区，程序会额外告警。
#
#   临界车速恒等于 cap_speed 的 floor(帧高/触发距离) 倍，所以：
#     * cap_speed 调大 -> 覆盖上限高，但对系统的保护弱；
#     * cap_speed 调小 -> 保护强，但盲区来得更早（cap_speed=5 => 临界仅 10）。
#   唯一能同时改善两者的只有**缩短触发距离**（触发更密，k 的上限变大），
#   例如触发距离减半到 40.112 mm => floor=4 => 临界 40 m/min。
#   那是 PLC / 编码器的改动，不在软件范围内。
#   实测边界（模拟真实帧流，Modbus 每 100ms 喂速度）：
#       16.0 / 17.0 / 18.0 / 19.0 / 19.5 m/min  -> k=2，间距 160.4 mm，完整
#       20.0 / 20.5 / 21.0 m/min                -> k=3，间距 240.7 mm，盲区
#   20.0 是刀刃值：理论上 k=ceil(481.3/240.67)=2，但浮点累积会让第二帧落在
#   481.34 ms 刚好超阈值被拒，实际落到 k=3。**稳妥按 <=19 m/min 视为安全。**

#
# 另外：判定用**滑动中值**，不是 Modbus 的 current_speed 原始值。后者是单次
# 差分 |Δ距离/dt|x60，且 dt<=0 时兜底 0.001（单位毫秒=1 微秒）——两次采样
# 挨得极近时 1 个脉冲(0.023558 mm)就能算出 1413 m/min，直接判定会疯狂误触发。
#
# 策略取舍（现场已确认）：宁可漏检也要保护机器。
#   超过临界车速后钳帧必然产生盲区，这个代价已明确接受 —— 盲区只告警，
#   不触发停机、不改变钳帧力度。但"漏了多少"必须看得见：每台相机钳掉的
#   帧数报成健康快照里的 cameraN.speed_capped，守卫状态报成 speed_guard.*。
#   钳到 cap_speed_mpm 的触发率等于把负载拉回 10 m/min 的设计点
#   （2.0775 帧/秒/台 x 8 台），是已验证能长期跑的工况，不需要钳得更狠。
#
speed_guard:
  enabled: true
  # 机器实际运行速度就是 10 m/min。所以下面两个数的含义是：
  #   cap_speed_mpm = 10.0 就是"按正常运行速度收图"，钳帧 = 回到正常工况；
  #   warn_mpm = 15.0 是**设计速度的 1.5 倍**，一个刻意放宽的容差带 ——
  #     留出余量是为了不被测速抖动和加减速瞬态误触发。不是可以随手往下压
  #     的任意阈值（有人提过降到 10，是错的：那等于把正常运行也钳了）。
  # 超过 15 已属异常；超过 20 出现盲区，而 20 是设计速度的 2 倍，
  # 正常运行根本不该到 —— 所以盲区告警同时也是"机器跑飞了"的信号。
  warn_mpm: 15.0             # = 设计速度 10 的 1.5 倍，容差上限
  cap_speed_mpm: 10.0        # = 机器实际运行速度，钳帧即回到正常工况
  trigger_distance_mm: 80.224  # = plc.trigger_distance_mm x scaling_factor
  frame_height_mm: 193.05    # = 2048 px x (real_width_cm 23 / 2440 px) x 10
  window: 5                  # 中值窗口样本数
  hysteresis: 0.9            # 退出钳帧要降到 阈值x0.9，防反复横跳

# ==================================================================
# ==================================================================
# 【六】边缘区自学习（当前用于多股线，结构上可扩展到其他类别）
# ==================================================================
# 布卷开头一段，camera2 图像右侧、camera7 图像左侧会稳定出现多股线检出。
# 那是布边/接布的固有特征，不是疵点，但每卷都在同一横向位置反复报。
# 本功能让每卷开头自己学出那条横向带，学出来之后本卷永久过滤。
#
# 两个区，别混：
#   **学习区** 固定的，就是下面 targets 里的边带
#              （camera2 右 350 px / camera7 左 350 px）。
#              只有落在这里的框才会被降阈值、被采样。
#   **生效区** 算出来的，每卷不同：学习期结束后用学习区里采到的框
#              统计 [min(x1), max(x2)]，左右各外扩 region_padding_px。
#              这才是真正用来过滤的区域。
#   生效区由学习区统计而来但**不等于**学习区：可能更窄（布边实际只占
#   一小段），也可能因外扩而略微越出 350 px。
#
# 学习期（是否生效**只由米长判断**）：
#   起点 = 前端下发「开始」 或 程序启动，取先到者
#   终点 = 米长从起点累计增长到 window_length_mm（10 m）
#   学习期内，**只在学习区内**把目标类阈值降到 learning_threshold
#   （0.1，正常 0.65），把"看得见但够不到阈值"的布边检出捞进来采样；
#   落在学习区内的框只记录、不保存、不上传。
#   学习区**外**照旧用正常阈值 —— 所以区外根本不会产生低置信度噪声框。
#
# 前端「停止」表示**这批布结束了**，它不是学习期的终点：
#   不会用半截数据去凑生效区（没走到 10 m 就是没学成），
#   只负责清场 —— 生效区是本卷的，布都下机了就该失效。
#
# 学习期结束：某个 (相机, 类别) 的采样数 > count_threshold（默认 5，
# 即 ≥6 个）才生成生效区，成为**本卷**该类的过滤区。
#
# 生效区按 **(相机, 类别)** 分别存：
#   * 不同相机 —— camera2 学右侧、camera7 学左侧，两张不同的图，
#     横向坐标没有可比性，共用区间会拿一台的布边屏蔽另一台的真缺陷；
#   * 不同类别 —— 各类疵点的布边位置也没有关系，同样各存各的。
#     过滤时只对 target_classes 里的类生效，绝不会波及别的疵点。
#
# target_classes 是列表，以后要加类别直接往里添，代码不用改。
#
multiline_edge_learning:
  enabled: true
  target_classes: [多股线, 短废纱线]   # 列表；后续可加其他类别
  learning_threshold: 0.1      # 学习期临时阈值（正常 0.65），只在学习区内生效
  window_length_mm: 5000       # 学习长度（全局默认）：米长增长 5 m
  count_threshold: 5           # 采样数**超过** 5 个才生成生效区
  region_padding_px: 50        # 生效区左右各外扩
  image_width_px: 2440         # 与 size_conversion.image_width_px 一致
  # 按类别覆盖上面两个值（window_length_mm / count_threshold）。
  #
  # 每个类别的窗口各算各的：多股线 5 m 就结算，短废纱线要等到 50 m，
  # 互不干扰（旧实现只有一个全局窗口，谁短谁先到点还会把别的类一起结算）。
  #
  # 规则：
  #   - 类别必须**同时**出现在上面的 target_classes 里，否则这条覆盖不生效
  #     （配错会打 warning，不会静默）
  #   - 两个字段都可以只写一个，没写的那个走全局默认
  #   - 完全不列的类别 = 两个值都用全局默认
  #   - count_threshold 是**严格大于**：写 5 表示采到 6 个才生成生效区
  #
  # 新增类别两步：① 加进 target_classes ② 需要不同参数就在下面补一段
  #   例：  小尾巴:
  #           window_length_mm: 20000   # 只改窗口，门槛仍走全局 5
  #
  class_rules:
    多股线:                      # 与全局默认相同，写出来是为了让配置自解释
      window_length_mm: 5000     # 5 m
      count_threshold: 5         # **超过** 5 个，即采到 6 个才生成生效区
    短废纱线:
      window_length_mm: 50000    # 50 m
      count_threshold: 3         # **超过** 3 个，即采到 4 个才生成生效区
  targets:                     # 学习区（固定边带）
    camera2: {side: right, band_px: 500}
    camera7: {side: left,  band_px: 500}
# ==================================================================
# 【七】后端下发的材质检测配置（阈值 + 停机规则）
# ==================================================================
# 启动时、前端点「开始」时、以及每 refresh_interval_sec 秒，向后端拉一次
#     GET {api_base_url}/api/v1/defect/material/current-config
# 后端按当前白布的**材质+规格**下发每台相机的检测阈值和停机规则，
# 这是业务上的权威来源，优先级高于本文件的 class_confidence_thresholds /
# camera_threshold_overrides / machine_stop_rules / camera_stop_rule_overrides。
#
# 优先级：后端下发 > 按相机覆盖 > 全局。
# 唯一例外：machine_stop_rules.enabled 这个总开关仍然最高 ——
# 它是现场的急停手段，后端不该能绕过它。
#
# 拉取失败时**保留上一次成功的结果，绝不清空**。拉取失败就把配置清掉，
# 等于让整条产线突然换回另一套阈值，比继续用一份稍旧的配置危险得多。
# 第一次就失败时覆盖层是空的，自动退回本文件的配置。
#
# 两个约定字段的处理（接口约定"启用禁用项都返回，调用方自行判断"）：
#   thresholds[].status == 0     -> 不下发这条阈值，该类退回本文件配置。
#                                   **不**把它当成"这个类别不检测"：
#                                   静默关掉一个类别就是静默漏检，
#                                   这种决定不该由一个后端字段悄悄触发。
#                                   被跳过的条目会打进日志。
#   stopSetting[].enabled=false  -> 照原样应用，即"这台相机上这个类不停机"。
#                                   与本文件语义一致；仍然检测、仍然记录，
#                                   只是不触发停机。
#
# model.modelPath **只报告不热切**：换模型要重建每个 worker 的 TensorRT
# engine，是重操作且不可回滚。与本地 yolo.model_path 不一致时只告警，
# 由人决定是否改配置重启。
#
material_config:
  enabled: true
  refresh_interval_sec: 60     # 定时刷新间隔；<=0 表示只在启动和「开始」时拉
  timeout_sec: 5               # 单次请求超时
  fetch_on_start: true         # 前端点「开始」（新布卷）时是否重新拉
  #  —— 开局以数据库为准 ——
  #  true  = 启动时**阻塞**等待后端配置（最多 timeout_sec+3 秒），拿到才启动
  #          检测，所以第一帧起用的就是数据库那份检测/停机配置。
  #          后端拉不到时会明确打出「开局配置来源：config.yaml 本地配置」。
  #  false = 不等网络，先用本地 config.yaml 开机，后端配置拉到了再热切过去
  #          （开头那几秒用的是本地值）。
  #  等待有硬上限，后端挂了也不会把开机流程卡死。
  wait_on_start: true
  #  —— 变更明细打印行数 ——
  #  每次成功下发都会打「哪台相机变了、由什么变成什么」。默认 0 = 全部打印，
  #  因为前端点一次「全部相机」就会让 8 台一起动，截断会让后面的相机看起来
  #  像没变。真嫌长（比如 144 条阈值全变）可以设成正整数只打前 N 行；
  #  「变化相机」那一行始终打全，不受这个值影响。改完热更新即生效。
  max_diff_lines: 0
  #  —— 日志静音 ——
  #  轮询间隔很短（现场 2s）时，「没有变更」这类稳定状态每轮重打一遍会把真正
  #  有用的变更明细淹掉。true = 只在**出错**或**真的发生变更**时打日志；
  #  「跳过 N 条阈值」「变更未生效」「模型不一致」这些稳定状态只在内容变化时
  #  打一次，故障恢复后再次出现会重新打。想确认轮询还活着可改成 false，
  #  那时每轮都会打一行「变化 0 项 —— 无需改动」。
  quiet_when_unchanged: true
  #  —— 接口地址 ——
  #  默认**全部回落到全局** upload.api_host / api_port / api_base_path，
  #  最终地址 = http://localhost:8890/api + /v1/defect/material/current-config
  #  （现场实测就是这个地址，见日志 [材质配置] 已应用：...）。
  #  单独留下面三项，是为了万一后端把它挪到别的服务/端口：改这里即可，不用动
  #  代码。不要去改上面 upload.api_port —— 检测信息上报、布料尺寸上报、
  #  周期上报全都靠那三项，改了会一起跑偏。
  # api_port: 8001             # 本接口若挪到别的服务/端口，取消注释即可
  # api_host: ""               # 留空 = 沿用全局 upload.api_host
  # api_base_path: ""          # 留空 = 沿用全局 upload.api_base_path(/api)
heatmap:
  enabled: true
  save_overlay: true
  colormap: "jet"
  overlay_alpha: 0.5
  save_mask_overlay: true
  mask_color: [0, 0, 255]
  save_pure_heatmap: false

# ------------------------------------------------------------------
# 类别尺寸过滤（不纳入检测）  [热更新]
# ------------------------------------------------------------------
class_size_filter:
  包边不重叠: {min_width: 170, min_height: 100}
  小尾巴:     {min_width: 170}
  单根包不进: {min_width: 100, min_height: 100}
  纬线杂质:   {min_width: 70, min_height: 70}
  油点线:     {min_height: 150}
  飘絮: {min_width: 85, min_height: 85}

# ------------------------------------------------------------------
# 类别边缘距离过滤（洪泛切除区距离阈值，单位：像素）  [热更新]
# ------------------------------------------------------------------
class_edge_filter:
  飘絮:       {max_distance_to_fabric: 150}
  棉团:       {max_distance_to_fabric: 150}
  单根包不进: {max_distance_to_fabric: 200}
  短废纱线:   {max_distance_to_fabric: 200}
  蚊虫小黑点: {max_distance_to_fabric: 150}


# ------------------------------------------------------------------
# 竖线误检过滤
# [热更新] max_x_deviation / min_accumulate_count / time_window / target_*
# [需重启] enabled —— 它决定过滤器对象是否被创建
# ------------------------------------------------------------------
vertical_line_filter:
  enabled: false
  target_cameras: ["camera1", "camera8"]
  target_classes: ["纬线杂质", "飘絮"]
  max_x_deviation: 50.0
  min_accumulate_count: 3
  time_window: 20.0

# ------------------------------------------------------------------
# YOLO 检测配置
# ------------------------------------------------------------------
yolo:
  model_path: "./Modelfile/yolo_20260608.engine"
  # 多模型切换：按布料是否含边缘选用不同模型；留空(null)则始终使用上面的 model_path
  with_edge_model_path: null
  without_edge_model_path: null
  confidence: 0.1
  image_size: 1280
  iou_threshold: 0.5
  patch_size: 640
  num_workers: 5
  # 采集队列长度。这是"缓冲"不是"性能"：队列越长，过载时端到端延迟越大。
  # 派发线程会按相机去重只保留最新帧，因此不需要很长的队列。
  queue_size: 32
  dinomaly_use_fp16: true
  use_cuda_stream: true
  cuda_benchmark: true
  pth_checkpoint: "./Modelfile/YoloDinomaly/best_acc.pth"
  pth_device: "cuda:0"
  pth_model_source_dir: "./Modelfile/YoloDinomaly"
  mask_threshold: 0.7
  # 在途帧上限 —— 端到端延迟的决定性参数。
  # 延迟 ≈ max_inflight_frames / 实际吞吐(帧/秒)。
  # 原值 128：若吞吐为 20 帧/s，排队延迟就高达 6 秒，而且 128 帧 x 15MB
  # 会占用近 2GB 内存。它的本意是内存保护，却被当成了性能参数。
  # 实时场景应取 2~3 倍 num_workers：够填满流水线，又不至于堆积。
  max_inflight_frames: 12
  memory_high_watermark: 90
  memory_critical_watermark: 95
  post_workers: 6
  upload_timeout: 10

# ------------------------------------------------------------------
# 并发与采样
# ------------------------------------------------------------------
# 说明：全局线程池的规模集中在这里，便于按现场 CPU/GPU 情况整体调参。
# 叠加 yolo.num_workers 与 yolo.post_workers 后即为进程内工作线程总量，
# 设置过大反而会加剧 GIL 争用与 GPU 显存竞争。
concurrency:
  warp_sample_interval: 2     # 每 N 帧提交一次经线分析（增大可降低 GPU 争用）
  weft_sample_interval: 2     # 每 N 帧提交一次纬线分析
  warp_workers: 2             # 经线分析线程数
  weft_workers: 2             # 纬线分析线程数
  save_workers: 2             # 经纬停机图落盘线程数
  async_save_workers: 4       # 检测结果保存+上传线程数
  infer_pool_workers: 2       # 管理器侧推理提交池
  io_pool_workers: 4          # 管理器侧后处理 I/O 池
  aux_io_workers: 2           # 主程序调试存图/推帧池

# ------------------------------------------------------------------
# 保存配置
# ------------------------------------------------------------------
save:
  save_original: true
  # 落盘格式：png 无损但慢（2440x2048 约 179ms/张、8MB），
  # jpg 质量 95 约 16ms/张、1.1MB —— 编码快 11 倍、磁盘压力小 7 倍。
  # 若下游要求无损取证，改回 "png"（会显著增加保存耗时与磁盘 IO）。
  image_format: "png"
  jpeg_quality: 100

# ------------------------------------------------------------------
# 继电器配置
# ------------------------------------------------------------------
# [需重启] 继电器参数在启动时读取一次，改完需重启程序。
relay:
  # 串口号，例如 "COM6"。
  # 留空 ("") 表示按 CH340 的 VID/PID 自动识别；
  # 现场接了多个 CH340 设备时必须在这里明确指定，程序不会去猜。
  # 启动时会在日志里打印最终使用的端口，可据此核对。
  port: "COM6"
  baudrate: 9600
  channel: 1              # 继电器通道，1 或 2
  pulse_ms: 2            # 吸合时长（毫秒）
  cooldown_seconds: 0     # 两次触发之间的最小间隔（秒）

# ------------------------------------------------------------------
# 模拟模式
# ------------------------------------------------------------------
simulation:
  mode: false
  folder: "D:\\DataFile\\dataset\\20260703"

# ------------------------------------------------------------------
# 布幅检测配置
# ------------------------------------------------------------------
fabric_width:
  enabled: true
  primary_cameras:
    camera1: "right"
    camera8: "left"
  fallback_cameras:
    camera2: "right"
    camera7: "left"
  camera8_right_edge: 31.0
  camera8_left_edge: 0.6
  camera7_right_edge: 53.4
  camera7_left_edge: 19.0
  camera2_left_edge: 139.0
  camera2_right_edge: 168
  camera1_left_edge: 157.0
  camera1_right_edge: 178.6
  seed_tol: 8
  min_area: 50
  blank_fg_ratio: 0.02
  blank_threshold: 3
  window_size: 20
  report_interval: 10
  # ── 兜底布幅 ──────────────────────────────────────────────
  # 只在**从头到尾一次都没算出过**布幅时，上报这个范围内的波动值代替 0
  # —— 上游收到 width=0 会被当成断布/异常。
  #
  # 什么时候**不会**用兜底值（这是刻意设计，不要"顺手加个超时修好"）：
  #   一旦算出过实测值，之后无论多久算不出来，都**一直沿用上次实测值**，
  #   永远不会切换到 1580~1600。理由：
  #     1. 算出来过就证明布幅是能算的，算不出来是暂时现象（换布、接头、
  #        布边短暂丢失），沿用上次值比换一个假值更接近真相；
  #     2. 布幅不能突变。实测停在 1400mm 时若切到 1590mm，是一次 190mm
  #        的跳变，上游会看出异常。
  #   要改这条规则请连 Test_Tool/test_fabric_width_fallback.py 里的
  #   test_end_to_end_stale_value_is_never_replaced 一起改。
  #
  # 单位 mm（内部按 cm 计算，这里直接写现场习惯的 mm）。
  # 1580~1600 与实测吻合：满幅 camera1_right 178.6 − camera8_left 0.6
  # = 178.0cm，减去两侧切除比后约 147~162cm。
  #
  # 这是**合成值，不是测量值**。首次生成会在日志告警一次，
  #    get_stats() 里 fabric_width_is_fallback 为 true，
  #    原始测量值仍保留在 last_fabric_width（没算出来就是 null）。
  # 两个都设为 0 表示关闭兜底（恢复上报 0）。
  fallback_width_min_mm: 1580
  fallback_width_max_mm: 1600
  # 兜底值多久重新取一次（秒）。一个周期内所有读取方拿到同一个值，
  # 避免 Modbus 上报和定时上报读到两个不同的数。
  # 与上面 plc.fabric_upload_interval 对齐。
  #
  # 注意：取值是区间内**均匀随机**，所以相邻两个周期的值最大可差
  # (max−min)，即当前配置下最多 20mm。这是现场选定的行为
  # （要更平滑就缩小 min/max 的差距，例如 1585~1595）。
  fallback_refresh_sec: 5.0

# ------------------------------------------------------------------
# 经线密度均匀性
# ------------------------------------------------------------------
warp_density:
  enable: true           # [需重启] 是否开启经线密度均匀性检测
  trigger: false         # [热更新] 是否触发停机
  stop_trigger: 0.45     # [热更新] 均匀度低于此值触发停机

# ------------------------------------------------------------------
# 纬线密度
# ------------------------------------------------------------------
weft_density:
  enable: true                      # [需重启] 是否开启纬线检测
  trigger: false                    # [热更新] 是否触发停机
  stop_trigger: 260                 # [热更新] 最大纬线间距超过此值触发停机
  lat_slope_angle_threshold: 5.0    # [热更新] 纬斜角度超过此值触发停机
  save_weft: false
  output_dir: "D:/yolo_detection_results/test"

# 经纬密度触发停机保存地址
warp_weft_output_dir: "D:/yolo_detection_results/test"

# ------------------------------------------------------------------
# 相机 SN -> 名称映射 / 采集参数（大恒图像 Galaxy SDK）
# ------------------------------------------------------------------
cameras:
  sn_map:
    KBA26070032: "camera1"
    KBA26070064: "camera2"
    KBA26070030: "camera3"
    KBA26070029: "camera4"
    KBA26070057: "camera5"
    KBA26070056: "camera6"
    KBA26070061: "camera7"
    KBA26070034: "camera8"

  # 采集参数（改完需重启）
  acquisition:
    # SDK 采集缓冲节点数。旧的海康实现硬编码为 1，回调稍慢一点 SDK 内部
    # 就没有可用缓冲，直接丢帧。10 个节点在 8 路 2440x2048 下约占
    # 8 x 10 x 5MB ≈ 400MB，按现场内存酌情增减。
    buffer_count: 10
    # GigE 包长(GevSCPSPacketSize)。三种取值：
    #   0  = 自动（推荐）。按**本机网卡实测 MTU** 取最大安全值：交换机和网卡
    #        都开了巨型帧就自动用上（能明显降低 CPU 占用与丢包率），
    #        没开就自动退回 1500。探测不到 MTU 时保守用 1500，不会冒险。
    #   >0 = 指定值。但仍会被实测 MTU 夹紧——即使这里写成 9000 而链路只有
    #        1500，代码也会下调并告警，不会让相机发出链路收不下的包。
    #   -1 = 完全不碰这个特征，沿用相机出厂/上次保存的值。
    #
    # 为什么要夹紧 + 回读：GevSCPSPacketSize 是**相机端**设置，SDK 只校验它
    # 是否落在相机自己支持的范围内，**完全不知道链路能过多大的包**。现场出现
    # 过"巨型帧明明开着、但包超过设置值导致相机启动不起来"就是这个原因。
    # 现在写进相机的值永远不会超过实测 MTU，并且设置后会回读确认相机真的采纳了。
    packet_size: 0
    # ---- 触发错峰（TriggerDelay）----
    #
    # 为什么需要：8 台相机接同一根 Line0 触发线，一次触发 8 台**同时**开始推流。
    # 按现场分辨率 2440x2048 算，一次突发是：
    #   上线  38.1 MiB（8 × 4.77 MiB）
    #   BGR  114.4 MiB，在 8 条 SDK 回调线程上**同时**分配
    #
    # 设成 N 后按相机序号错开 TriggerDelay：
    #   camera1=0、camera2=N … camera8=7N（微秒）
    # **硬触发和软触发都生效**：TriggerDelay 挂在 TriggerSelector=FrameStart 上，
    # 与 FrameStart 由 Line0 还是 TriggerSoftware 发起无关；切触发源时会重下发
    # （见 CameraOperation.Set_trigger_source）。
    #
    # 取值判据（实测出来的，别凭感觉改）：
    #    决定"够不够"的是**步长 N**，不是总跨度。因为各台的到达时刻正好相差 N：
    #      · 8 台各走独立网卡 -> 到达间隔 = N
    #      · 8 台共用一张网卡 -> 链路本身把它们串起来，到达间隔 ≈ 40 ms（单帧
    #        4.766 MiB @1GbE 的传输时间），比 N 还大
    #    两种拓扑下到达间隔都 >= N。
    #    而每次回调要做的重活是 14.30 MiB 分配 + Bayer->BGR，实测
    #    **2.62 ms**（2440x2048，cv2.cvtColor，开发机 CPU）。
    #    所以只要 N > 2.62 ms，8 个转换就不会重叠 —— 任一时刻最多 1 个在跑。
    #    当前 N = 7000us = 7 ms，有 2.7 倍余量（留给现场机器比开发机慢的情况）。
    #
    # 能力边界（别误判错峰能干什么）：
    #    错峰消除的是"8 条回调线程**同时**做分配和色彩转换"这个瞬时尖峰。
    #    它**削不掉**"8 帧同时驻留"的 114.4 MiB —— 因为检测一帧要几百 ms，
    #    远大于 49 ms 的错峰跨度，8 帧必然同时在场。
    #    那个驻留峰值**不能**靠降 yolo.max_inflight_frames 去封：
    #    blocking_submit 默认 False，worker_pool.submit() 满了是**丢帧**
    #    （记 semaphore_dropped），会造成漏检。本产线不接受漏检。
    #
    # 几何代价，以及为什么可以放心取这么大：
    #    10 m/min = 0.1667 mm/ms，camera8 相对 camera1 的**纵向**（走布方向）偏移
    #    = 7 × N × 0.1667：
    #      N = 5000us -> 5.8 mm
    #      N = 7000us -> 8.2 mm   ← 当前
    #      N = 8571us -> 10.0 mm  （已到硬上限）
    #    这个偏移不影响检测，因为：
    #      · 检测与停机规则都是**逐相机**判定（stop_machine_service 按
    #        camera_name 取规则），不跨相机比对位置；
    #      · 唯一跨相机的量是布幅，fabric_width_detector._calculate_width 用的是
    #        **横向**物理边界常数 + 空白比例，布边在列方向的位置不随纵向平移变化；
    #      · 帧高 2048px × (230mm/2440px) = **193 mm**，而触发间距只有 80.2 mm，
    #        相邻帧本就重叠 2.4 倍 —— 8.2 mm 的错位远小于一帧覆盖，
    #        **不会有任何一段布面因此漏拍**。
    #
    # 上限与车速：camera8 的延时（7 × N）+ 单帧传输 40 ms 必须 < 触发周期，
    #    否则上一次触发的帧还没走完就又来一次。触发是位置触发（每 80.224 mm 一次）：
    #      10 m/min -> 周期 481 ms；20 -> 241 ms；30 -> 160 ms
    #    当前 49 ms + 40 ms = 89 ms，要求车速 < 54 m/min。硬上限 60000us
    #    （步长最大 8571us）。
    #
    # 步长（不是单台延时）超限会被自动降到上限并告警。按单台截断会让顶部
    #    几台延时相同、间距归零，错峰**静默**失效（实测 4000us 时
    #    camera6/7/8 全变成同一个值）。
    #
    # 相机名解析不出序号时（比如退化成了序列号）**一律按 0 处理**，
    # 即这台不错峰 —— 不会算出一个天文数字的延时让相机永远不出图。
    trigger_stagger_us: 7000
    # GigE 心跳超时(ms)。0 = 不修改。链路被拔/交换机抖动时，超时太长会让
    # SDK 长时间阻塞在收包上，外部看起来就是"卡死"。
    heartbeat_timeout_ms: 3000
    # 开机默认触发源：Line0(硬触发，正常检测) / Software(软触发，调试用)
    trigger_source: "Line0"
    # 枚举设备超时(ms)。8 台相机跨多网段时，SDK 默认的 200ms 有时不够。
    enum_timeout_ms: 2000

# ------------------------------------------------------------------
# 调试与原图保存配置
# ------------------------------------------------------------------
debug:
  save_path: "D:/fabric_ex_data"
  save_image: false
  push_to_java: false

  # ---- 触发突发探针 ----
  # 记录"一次触发实际同时到达了几台相机、首末相差多少 ms、当时内存什么状况"。
  #
  # 为什么需要：现场现象是**整机卡死后断电**。断电指向电源（过流/温度保护），
  # 而 8 台相机同时推流正好是一个瞬时功率尖峰。但"是不是真的 8 台同时到达"
  # 光看代码推不出来 —— 取决于 8 台是不是接同一张网卡、交换机、触发线本身。
  # 所以这里测**实际到达分布**，下次出事时日志最后几行就是证据。
  #
  # 代价：SDK 回调线程上多一次 deque 追加（约 1 微秒），分析在独立守护线程做。
  burst_probe: true
  burst_report_interval: 30      # s，多久汇总一次
  burst_min_cameras: 2           # 一次触发里到达 >= 这么多台才报告